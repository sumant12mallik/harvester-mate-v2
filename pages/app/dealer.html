<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0A0F1C">
  <title>Dealer Ledger - HarvesterMate</title>
  <link rel="icon" href="/assets/icons/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="home-body">

  <nav class="navbar">
    <div class="navbar-left">
      <div class="navbar-brand">
        <div class="navbar-brand-icon" style="background:linear-gradient(135deg,#9C6FFF,#6A3FCC);">🤝</div>
        <div class="navbar-brand-text">
          <div class="navbar-title">Dealer Ledger</div>
          <div class="navbar-subtitle" id="seasonLabel">Kharif - 2026</div>
        </div>
      </div>
    </div>
  </nav>

  <div class="home-content">

    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" class="search-input" placeholder="Search dealer name, mobile...">
    </div>

    <a href="#" id="addDealerBtn" class="btn btn-primary btn-full" style="margin-bottom:16px; text-decoration:none;">
      <span>＋</span> Add Dealer
    </a>

    <!-- Tabs -->
    <div class="tabs-pill" id="dealerTabs">
      <button class="pill-tab active" data-filter="all">All</button>
      <button class="pill-tab" data-filter="paid">Paid</button>
      <button class="pill-tab" data-filter="due">Due</button>
    </div>

    <div id="dealerList"></div>

    <div id="emptyState" style="display:none; text-align:center; padding:40px 20px;">
      <div style="font-size:48px; opacity:0.3;">🤝</div>
      <p style="color:#7A8BA8; font-size:13px; margin-top:12px;">Koi dealer nahi</p>
    </div>

  </div>

  <nav class="bottom-nav">
    <a href="/pages/app/home.html" class="nav-item">
      <span class="nav-item-icon">🏠</span>
      <span class="nav-item-label">Home</span>
    </a>
    <a href="/pages/app/customers.html" class="nav-item">
      <span class="nav-item-icon">👥</span>
      <span class="nav-item-label">Customers</span>
    </a>
    <a href="/pages/app/work.html" class="nav-item">
      <span class="nav-item-icon">⏱️</span>
      <span class="nav-item-label">Work</span>
    </a>
    <a href="/pages/app/reports.html" class="nav-item">
      <span class="nav-item-icon">📊</span>
      <span class="nav-item-label">Reports</span>
    </a>
    <a href="/pages/app/more.html" class="nav-item">
      <span class="nav-item-icon">⋯</span>
      <span class="nav-item-label">More</span>
    </a>
  </nav>

  <script type="module" src="/js/pages/dealer.js"></script>
</body>
</html>
