<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0A0F1C">
  <title>Diesel - HarvesterMate</title>
  <link rel="icon" href="/assets/icons/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="home-body">

  <nav class="navbar">
    <div class="navbar-left">
      <div class="navbar-brand">
        <div class="navbar-brand-icon" style="background:linear-gradient(135deg,#FFA726,#F57C00);">⛽</div>
        <div class="navbar-brand-text">
          <div class="navbar-title">Diesel</div>
          <div class="navbar-subtitle" id="seasonLabel">Kharif - 2026</div>
        </div>
      </div>
    </div>
  </nav>

  <div class="home-content">

    <a href="#" id="addDieselBtn" class="btn btn-primary btn-full" style="margin-bottom:16px; text-decoration:none;">
      <span>＋</span> Add Diesel Entry
    </a>

    <!-- Summary cards -->
    <div class="grid-2" style="gap:12px; margin-bottom:16px;">
      <div class="card" style="padding:16px;">
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
          <div style="width:36px; height:36px; border-radius:50%; background:rgba(255,167,38,0.15);
                      color:#FFA726; display:flex; align-items:center; justify-content:center; font-size:18px;">⛽</div>
          <div style="font-size:11px; color:#7A8BA8; text-transform:uppercase; letter-spacing:0.05em;">Total Liters</div>
        </div>
        <div style="font-size:22px; font-weight:800; color:#FFA726; font-family:monospace;" id="totalLiters">0 L</div>
      </div>
      <div class="card" style="padding:16px;">
        <div style="display:flex; align-items:center; gap:10px; margin-bottom:8px;">
          <div style="width:36px; height:36px; border-radius:50%; background:rgba(239,83,80,0.15);
                      color:#FF4757; display:flex; align-items:center; justify-content:center; font-size:18px;">💰</div>
          <div style="font-size:11px; color:#7A8BA8; text-transform:uppercase; letter-spacing:0.05em;">Total Cost</div>
        </div>
        <div style="font-size:22px; font-weight:800; color:#FF4757; font-family:monospace;" id="totalCost">₹0</div>
      </div>
    </div>

    <div class="home-section-title">Diesel Entries</div>
    <div id="dieselList"></div>

    <div id="emptyState" style="display:none; text-align:center; padding:40px 20px;">
      <div style="font-size:48px; opacity:0.3;">⛽</div>
      <p style="color:#7A8BA8; font-size:13px; margin-top:12px;">Koi diesel entry nahi</p>
    </div>

  </div>

  <nav class="bottom-nav">
    <a href="/pages/app/home.html" class="nav-item">
      <span class="nav-item-icon">🏠</span>
      <span class="nav-item-label">Home</span>
    </a>
    <a href="/pages/app/customers.html" class="nav-item">
      <span class="nav-item-icon">👥</span>
      <span class="nav-item-label">Customers</span>
    </a>
    <a href="/pages/app/work.html" class="nav-item">
      <span class="nav-item-icon">⏱️</span>
      <span class="nav-item-label">Work</span>
    </a>
    <a href="/pages/app/reports.html" class="nav-item">
      <span class="nav-item-icon">📊</span>
      <span class="nav-item-label">Reports</span>
    </a>
    <a href="/pages/app/more.html" class="nav-item">
      <span class="nav-item-icon">⋯</span>
      <span class="nav-item-label">More</span>
    </a>
  </nav>

  <script type="module" src="/js/pages/diesel.js"></script>
</body>
</html>
