<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0A0F1C">
  <title>Add Driver - HarvesterMate</title>
  <link rel="icon" href="/assets/icons/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="home-body">

  <nav class="navbar">
    <div class="navbar-left">
      <a href="/pages/app/drivers.html" class="navbar-btn" style="text-decoration:none;">←</a>
      <div class="navbar-brand-text">
        <div class="navbar-title">Add Driver</div>
        <div class="navbar-subtitle" id="seasonLabel">Kharif - 2026</div>
      </div>
    </div>
  </nav>

  <div class="home-content" style="padding-bottom:100px;">

    <div id="formError" class="auth-error"></div>

    <form id="driverForm">

      <div class="home-section-title">👤 Driver Details</div>

      <div class="input-group">
        <div class="input-wrapper">
          <span class="input-icon">👤</span>
          <input type="text" id="driverName" class="input-field has-icon"
                 placeholder="Driver Name" maxlength="50" required>
        </div>
      </div>

      <div class="input-group">
        <div class="input-wrapper">
          <span class="input-icon">📱</span>
          <input type="tel" id="driverMobile" class="input-field has-icon"
                 placeholder="Mobile Number" maxlength="10" inputmode="numeric" required>
        </div>
      </div>

      <div class="input-group">
        <label class="input-label">Assigned Harvester</label>
        <input type="text" id="assignedTo" class="input-field"
               placeholder="e.g. Mahindra 575" maxlength="40">
      </div>

      <div class="home-section-title" style="margin-top:20px;">💰 Payment Info</div>

      <div class="rate-inputs">
        <div class="input-group">
          <label class="input-label">Daily Rate (₹)</label>
          <input type="number" id="dailyRate" class="input-field" value="500" min="0" step="50">
        </div>
        <div class="input-group">
          <label class="input-label">Assigned Hours</label>
          <input type="number" id="assignedHours" class="input-field" value="0" min="0" step="0.5">
        </div>
      </div>

      <div class="input-group">
        <label class="input-label">Status</label>
        <select id="status" class="input-field">
          <option value="Active">Active</option>
          <option value="On Leave">On Leave</option>
          <option value="Inactive">Inactive</option>
        </select>
      </div>

      <div class="input-group">
        <label class="input-label">Notes (Optional)</label>
        <textarea id="notes" class="input-field" placeholder="Koi note likho..." maxlength="200" rows="2"></textarea>
      </div>

    </form>

  </div>

  <div style="position:fixed; bottom:0; left:0; right:0; padding:16px; background:linear-gradient(180deg, transparent, #0A0F1C 30%); z-index:50;">
    <button type="submit" form="driverForm" id="saveBtn" class="btn btn-primary btn-full">
      💾 Save Driver
    </button>
  </div>

  <script type="module">
    import { db, auth } from '/js/config/firebase-config.js';
    import { collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    const form = document.getElementById('driverForm');
    const errorEl = document.getElementById('formError');
    const btn = document.getElementById('saveBtn');

    // Season label
    const season = localStorage.getItem('hm_selected_season') || 'Kharif';
    const year = localStorage.getItem('hm_selected_year') || new Date().getFullYear();
    document.getElementById('seasonLabel').textContent = `${season} - ${year}`;

    // Mobile: only digits
    document.getElementById('driverMobile').addEventListener('input', (e) => {
      e.target.value = e.target.value.replace(/\D/g, '').slice(0, 10);
    });

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.remove('active');

      const name = document.getElementById('driverName').value.trim();
      const mobile = document.getElementById('driverMobile').value.trim();

      if (!name || name.length < 2) {
        errorEl.textContent = 'Sahi naam daalo';
        errorEl.classList.add('active');
        return;
      }
      if (mobile.length !== 10) {
        errorEl.textContent = 'Sahi 10 digit mobile daalo';
        errorEl.classList.add('active');
        return;
      }

      btn.disabled = true;
      btn.textContent = '💾 Saving...';

      try {
        const ownerId = auth.currentUser?.uid;
        const seasonId = `${season}_${year}`.replace(/\s+/g, '');

        await addDoc(collection(db, `harvesters/${ownerId}/seasons/${seasonId}/drivers`), {
          name,
          mobile,
          assignedTo: document.getElementById('assignedTo').value.trim(),
          dailyRate: Number(document.getElementById('dailyRate').value) || 0,
          assignedHours: Number(document.getElementById('assignedHours').value) || 0,
          status: document.getElementById('status').value,
          notes: document.getElementById('notes').value.trim(),
          createdAt: Date.now(),
          updatedAt: serverTimestamp()
        });

        alert('✅ Driver saved!');
        window.location.href = '/pages/app/drivers.html';
      } catch (err) {
        errorEl.textContent = 'Error: ' + err.message;
        errorEl.classList.add('active');
        btn.disabled = false;
        btn.textContent = '💾 Save Driver';
      }
    });
  </script>
</body>
</html>
