<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0A0F1C">
  <title>Search - HarvesterMate</title>
  <link rel="icon" href="/assets/icons/favicon.ico">
  <link rel="manifest" href="/manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="home-body">

  <nav class="navbar">
    <div class="navbar-left">
      <div class="navbar-brand">
        <div class="navbar-brand-icon">🔍</div>
        <div class="navbar-brand-text">
          <div class="navbar-title">Search Customer</div>
          <div class="navbar-subtitle">Sab seasons me search</div>
        </div>
      </div>
    </div>
  </nav>

  <div class="home-content">

    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" class="search-input" placeholder="Name, mobile ya village type karo...">
    </div>

    <div class="tabs-pill" id="filterTabs">
      <button class="pill-tab active" data-filter="name">By Name</button>
      <button class="pill-tab" data-filter="mobile">By Number</button>
      <button class="pill-tab" data-filter="village">By Village</button>
    </div>

    <div id="searchInfo" style="display:none; padding:8px 4px; font-size:12px; color:#7A8BA8;"></div>

    <div id="resultsContainer">

      <div id="emptyState" style="text-align:center; padding:60px 20px;">
        <div style="font-size:60px; opacity:0.3;">🔍</div>
        <h3 style="color:#B0BEC5; margin-top:16px; font-size:16px;">Kuch search karo</h3>
        <p style="color:#7A8BA8; font-size:13px; margin-top:8px;">
          Customer ka naam, mobile ya village type karo
        </p>
      </div>

      <div id="loadingState" style="display:none; text-align:center; padding:40px;">
        <div class="spinner" style="margin:0 auto;"></div>
        <p style="color:#7A8BA8; font-size:13px; margin-top:12px;">Searching...</p>
      </div>

    </div>

  </div>

  <nav class="bottom-nav">
    <a href="/pages/app/home.html" class="nav-item">
      <span class="nav-item-icon">🏠</span>
      <span class="nav-item-label">Home</span>
    </a>
    <a href="/pages/app/customers.html" class="nav-item">
      <span class="nav-item-icon">👥</span>
      <span class="nav-item-label">Customers</span>
    </a>
    <a href="/pages/app/work.html" class="nav-item">
      <span class="nav-item-icon">⏱️</span>
      <span class="nav-item-label">Work</span>
    </a>
    <a href="/pages/app/reports.html" class="nav-item">
      <span class="nav-item-icon">📊</span>
      <span class="nav-item-label">Reports</span>
    </a>
    <a href="/pages/app/more.html" class="nav-item">
      <span class="nav-item-icon">⋯</span>
      <span class="nav-item-label">More</span>
    </a>
  </nav>

  <script type="module">
    import { auth, db } from '/js/config/firebase-config.js';
    import { collection, getDocs } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    let filterType = 'name';
    let query = '';
    let searchTimeout;

    function escape(s) {
      if (!s) return '';
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    function formatAmount(n) {
      return `₹${Number(n || 0).toLocaleString('en-IN')}`;
    }

    const input = document.getElementById('searchInput');
    const resultsEl = document.getElementById('resultsContainer');
    const emptyEl = document.getElementById('emptyState');
    const loadingEl = document.getElementById('loadingState');
    const infoEl = document.getElementById('searchInfo');

    input.addEventListener('input', (e) => {
      query = e.target.value.trim();
      clearTimeout(searchTimeout);
      if (query.length < 2) {
        showEmpty();
        return;
      }
      searchTimeout = setTimeout(performSearch, 400);
    });

    document.querySelectorAll('#filterTabs .pill-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('#filterTabs .pill-tab').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        filterType = tab.dataset.filter;

        const placeholders = {
          name: 'Customer ka naam likho...',
          mobile: '10 digit mobile number...',
          village: 'Village ka naam likho...'
        };
        input.placeholder = placeholders[filterType];

        if (query.length >= 2) performSearch();
      });
    });

    async function performSearch() {
      loadingEl.style.display = 'block';
      emptyEl.style.display = 'none';
      infoEl.style.display = 'none';

      resultsEl.querySelectorAll('.customer-card, .section-header').forEach(el => el.remove());

      try {
        const ownerId = auth.currentUser?.uid;
        if (!ownerId) return;

        const season = localStorage.getItem('hm_selected_season') || 'Kharif';
        const year = localStorage.getItem('hm_selected_year') || new Date().getFullYear();
        const currentSeasonId = `${season}_${year}`.replace(/\s+/g, '');

        const allSeasons = [
          { id: currentSeasonId, label: `${season} ${year}`, isCurrent: true },
          { id: 'Kharif_2025', label: 'Kharif 2025', isCurrent: false },
          { id: 'Rabi_2024', label: 'Rabi 2024', isCurrent: false },
          { id: 'Kharif_2024', label: 'Kharif 2024', isCurrent: false }
        ];

        const results = [];
        const q = query.toLowerCase();

        for (const s of allSeasons) {
          try {
            const snap = await getDocs(
              collection(db, `harvesters/${ownerId}/seasons/${s.id}/customers`)
            );

            snap.docs.forEach(d => {
              const c = { id: d.id, ...d.data() };
              const match = filterType === 'name'
                ? (c.name || '').toLowerCase().includes(q)
                : filterType === 'mobile'
                  ? (c.mobile || '').includes(q)
                  : (c.village || '').toLowerCase().includes(q);

              if (match) {
                results.push({ ...c, seasonLabel: s.label, isCurrent: s.isCurrent, seasonId: s.id });
              }
            });
          } catch (e) {
            // Skip seasons that don't exist
          }
        }

        renderResults(results);
      } catch (e) {
        console.error('Search failed:', e);
      } finally {
        loadingEl.style.display = 'none';
      }
    }

    function renderResults(results) {
      resultsEl.querySelectorAll('.customer-card, .section-header').forEach(el => el.remove());

      if (!results.length) {
        emptyEl.style.display = 'block';
        emptyEl.querySelector('h3').textContent = 'Koi result nahi mila';
        emptyEl.querySelector('p').textContent = `"${query}" ke liye kuch nahi mila`;
        return;
      }

      emptyEl.style.display = 'none';

      const current = results.filter(r => r.isCurrent);
      const old = results.filter(r => !r.isCurrent);

      infoEl.style.display = 'block';
      infoEl.textContent = `${results.length} results — ${current.length} current, ${old.length} previous seasons`;

      if (current.length) {
        const header = document.createElement('div');
        header.className = 'section-header';
        header.style.cssText = 'padding:16px 0 8px; font-size:12px; font-weight:700; color:#00FF88; text-transform:uppercase; letter-spacing:0.05em;';
        header.textContent = `📅 Current Season (${current.length})`;
        resultsEl.appendChild(header);
        current.forEach(c => resultsEl.appendChild(buildCard(c, true)));
      }

      if (old.length) {
        const header = document.createElement('div');
        header.className = 'section-header';
        header.style.cssText = 'padding:16px 0 8px; font-size:12px; font-weight:700; color:#FFA726; text-transform:uppercase; letter-spacing:0.05em;';
        header.textContent = `⚠️ Previous Seasons (${old.length})`;
        resultsEl.appendChild(header);
        old.forEach(c => resultsEl.appendChild(buildCard(c, false)));
      }
    }

    function buildCard(c, isCurrent) {
      const div = document.createElement('div');
      div.className = 'customer-card';

      const due = Math.max(0, (c.totalAmount || 0) - (c.totalPaid || 0));
      const isPaid = c.paymentClosed;

      div.innerHTML = `
        <div class="customer-avatar">${(c.name || '?').charAt(0).toUpperCase()}</div>
        <div class="customer-info">
          <div class="customer-name">${escape(c.name)}</div>
          <div class="customer-meta">
            ${escape(c.village || '')} • ${escape(c.mobile || '')}
            ${!isCurrent ? `<span style="color:#FFA726; margin-left:6px;">${escape(c.seasonLabel)}</span>` : ''}
          </div>
        </div>
        <div class="customer-right">
          <div class="customer-amount ${isPaid ? 'paid' : (due > 0 ? 'due' : '')}">
            ${isPaid ? 'PAID' : formatAmount(due)}
          </div>
          <span class="status-tag ${isPaid ? 'paid' : (due > 0 ? 'due' : 'paid')}">
            ${isPaid ? 'PAID' : (due > 0 ? 'DUE' : 'PAID')}
          </span>
        </div>
      `;

      div.addEventListener('click', () => {
        window.location.href = `/pages/app/customer-detail.html?id=${c.id}&season=${c.seasonId}`;
      });

      return div;
    }

    function showEmpty() {
      resultsEl.querySelectorAll('.customer-card, .section-header').forEach(el => el.remove());
      emptyEl.style.display = 'block';
      emptyEl.querySelector('h3').textContent = 'Kuch search karo';
      emptyEl.querySelector('p').textContent = 'Customer ka naam, mobile ya village type karo';
      loadingEl.style.display = 'none';
      infoEl.style.display = 'none';
    }
  </script>
</body>
</html>
