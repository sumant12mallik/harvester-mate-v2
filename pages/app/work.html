<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0A0F1C">
  <title>Work - HarvesterMate</title>
  <link rel="icon" href="/assets/icons/favicon.ico">
  <link rel="manifest" href="/manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="home-body">

  <nav class="navbar">
    <div class="navbar-left">
      <div class="navbar-brand">
        <div class="navbar-brand-icon">⏱️</div>
        <div class="navbar-brand-text">
          <div class="navbar-title">Work Logs</div>
          <div class="navbar-subtitle" id="workSubtitle">Today's work</div>
        </div>
      </div>
    </div>
  </nav>

  <div class="home-content">

    <div class="tabs-segmented" id="periodTabs">
      <button class="tab-segment active" data-period="today">Today</button>
      <button class="tab-segment" data-period="week">Week</button>
      <button class="tab-segment" data-period="month">Month</button>
      <button class="tab-segment" data-period="all">All</button>
    </div>

    <div class="grid-3" style="gap:8px; margin-bottom:16px;">
      <div class="card" style="text-align:center; padding:12px;">
        <div style="font-size:10px; color:#7A8BA8; text-transform:uppercase;">Total Time</div>
        <div style="font-size:15px; font-weight:700; color:#00FF88; margin-top:4px; font-family:monospace;" id="statTime">0h</div>
      </div>
      <div class="card" style="text-align:center; padding:12px;">
        <div style="font-size:10px; color:#7A8BA8; text-transform:uppercase;">Records</div>
        <div style="font-size:15px; font-weight:700; color:#4A9EFF; margin-top:4px; font-family:monospace;" id="statRecords">0</div>
      </div>
      <div class="card" style="text-align:center; padding:12px;">
        <div style="font-size:10px; color:#7A8BA8; text-transform:uppercase;">Amount</div>
        <div style="font-size:15px; font-weight:700; color:#FFA726; margin-top:4px; font-family:monospace;" id="statAmount">₹0</div>
      </div>
    </div>

    <div id="workList"></div>

    <div id="emptyState" style="display:none; text-align:center; padding:60px 20px;">
      <div style="font-size:60px; opacity:0.3;">⏱️</div>
      <h3 style="color:#B0BEC5; margin-top:16px; font-size:16px;">Koi work record nahi</h3>
      <p style="color:#7A8BA8; font-size:13px; margin-top:8px;">Is period me koi kaam nahi hua</p>
    </div>

  </div>

  <nav class="bottom-nav">
    <a href="/pages/app/home.html" class="nav-item">
      <span class="nav-item-icon">🏠</span>
      <span class="nav-item-label">Home</span>
    </a>
    <a href="/pages/app/customers.html" class="nav-item">
      <span class="nav-item-icon">👥</span>
      <span class="nav-item-label">Customers</span>
    </a>
    <a href="/pages/app/work.html" class="nav-item active">
      <span class="nav-item-icon">⏱️</span>
      <span class="nav-item-label">Work</span>
    </a>
    <a href="/pages/app/reports.html" class="nav-item">
      <span class="nav-item-icon">📊</span>
      <span class="nav-item-label">Reports</span>
    </a>
    <a href="/pages/app/more.html" class="nav-item">
      <span class="nav-item-icon">⋯</span>
      <span class="nav-item-label">More</span>
    </a>
  </nav>

  <script type="module" src="/js/pages/work.js"></script>
</body>
</html>
