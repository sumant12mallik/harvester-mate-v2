<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0A0F1C">
  <title>Customers - HarvesterMate</title>
  <link rel="icon" href="/assets/icons/favicon.ico">
  <link rel="manifest" href="/manifest.json">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="home-body">

  <nav class="navbar">
    <div class="navbar-left">
      <div class="navbar-brand">
        <div class="navbar-brand-icon">👥</div>
        <div class="navbar-brand-text">
          <div class="navbar-title">Customers</div>
          <div class="navbar-subtitle" id="seasonSubtitle">Kharif - 2026</div>
        </div>
      </div>
    </div>
  </nav>

  <div class="home-content">

    <!-- Search -->
    <div class="search-wrapper">
      <span class="search-icon">🔍</span>
      <input type="text" id="searchInput" class="search-input" placeholder="Search customer name, mobile...">
    </div>

    <!-- Add customer button -->
    <a href="/pages/app/add-customer.html" class="btn btn-primary btn-full" style="margin-bottom:16px; text-decoration:none;">
      <span>＋</span> Add Customer
    </a>

    <!-- Filter tabs -->
    <div class="tabs-pill" id="filterTabs">
      <button class="pill-tab active" data-filter="all">All</button>
      <button class="pill-tab" data-filter="paid">Paid</button>
      <button class="pill-tab" data-filter="due">Due</button>
    </div>

    <!-- Customer list -->
    <div id="customerList"></div>

    <!-- Empty state -->
    <div id="emptyState" style="display:none; text-align:center; padding:60px 20px;">
      <div style="font-size:60px; opacity:0.3;">👥</div>
      <h3 style="color:#B0BEC5; margin-top:16px; font-size:16px;">Koi customer nahi mila</h3>
      <p style="color:#7A8BA8; font-size:13px; margin-top:8px;">
        Naya customer add karne ke liye upar "Add Customer" dabao
      </p>
    </div>

  </div>

  <nav class="bottom-nav">
    <a href="/pages/app/home.html" class="nav-item">
      <span class="nav-item-icon">🏠</span>
      <span class="nav-item-label">Home</span>
    </a>
    <a href="/pages/app/customers.html" class="nav-item active">
      <span class="nav-item-icon">👥</span>
      <span class="nav-item-label">Customers</span>
    </a>
    <a href="/pages/app/work.html" class="nav-item">
      <span class="nav-item-icon">⏱️</span>
      <span class="nav-item-label">Work</span>
    </a>
    <a href="/pages/app/reports.html" class="nav-item">
      <span class="nav-item-icon">📊</span>
      <span class="nav-item-label">Reports</span>
    </a>
    <a href="/pages/app/more.html" class="nav-item">
      <span class="nav-item-icon">⋯</span>
      <span class="nav-item-label">More</span>
    </a>
  </nav>

  <script type="module" src="/js/pages/customers.js"></script>
</body>
</html>
