<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0A0F1C">
  <title>Owner Requests - Admin</title>
  <link rel="icon" href="/assets/icons/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="home-body">

  <nav class="navbar">
    <div class="navbar-left">
      <a href="/pages/admin/dashboard.html" class="navbar-btn" style="text-decoration:none;">←</a>
      <div class="navbar-brand-text">
        <div class="navbar-title">Owner Requests</div>
        <div class="navbar-subtitle">Approve / Reject</div>
      </div>
    </div>
  </nav>

  <div class="home-content">

    <div class="tabs-segmented" id="statusTabs">
      <button class="tab-segment active" data-status="pending">Pending</button>
      <button class="tab-segment" data-status="approved">Approved</button>
      <button class="tab-segment" data-status="rejected">Rejected</button>
    </div>

    <div id="requestsList"></div>

    <div id="emptyState" style="display:none; text-align:center; padding:60px 20px;">
      <div style="font-size:60px; opacity:0.3;">📋</div>
      <h3 style="color:#B0BEC5; margin-top:16px; font-size:16px;">Koi request nahi</h3>
      <p style="color:#7A8BA8; font-size:13px; margin-top:8px;">
        Is category me abhi kuch nahi hai
      </p>
    </div>

  </div>

  <script type="module">
    import { db } from '/js/config/firebase-config.js';
    import {
      collection, getDocs, doc, updateDoc, serverTimestamp
    } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-firestore.js";

    let allRequests = [];
    let currentStatus = 'pending';

    async function loadRequests() {
      try {
        const snap = await getDocs(collection(db, 'owner_requests'));
        allRequests = snap.docs.map(d => ({ id: d.id, ...d.data() }));
        render();
      } catch (e) {
        console.error('Load failed:', e);
      }
    }

    function render() {
      const list = allRequests.filter(r => r.status === currentStatus);
      const container = document.getElementById('requestsList');
      const empty = document.getElementById('emptyState');

      if (!list.length) {
        container.innerHTML = '';
        empty.style.display = 'block';
        return;
      }
      empty.style.display = 'none';

      container.innerHTML = list.map(r => {
        const isPending = r.status === 'pending';
        const isApproved = r.status === 'approved';
        const statusColor = isPending ? '#FFA726' : isApproved ? '#00FF88' : '#FF4757';
        const statusText = isPending ? 'PENDING' : isApproved ? 'APPROVED' : 'REJECTED';

        return `
          <div class="card" style="padding:16px; margin-bottom:12px;">
            <div style="display:flex; gap:12px; margin-bottom:12px;">
              <div class="customer-avatar">${(r.name || '?').charAt(0).toUpperCase()}</div>
              <div style="flex:1; min-width:0;">
                <div style="font-weight:700; color:#fff; font-size:15px;">${escape(r.name)}</div>
                <div style="font-size:12px; color:#7A8BA8; margin-top:4px;">
                  📍 ${escape(r.village || '—')} • 📞 +91 ${escape(r.mobile || '')}
                </div>
              </div>
              <span style="font-size:10px; font-weight:700; color:${statusColor};
                     background:${statusColor}22; padding:4px 10px; border-radius:20px;
                     height:fit-content; white-space:nowrap;">${statusText}</span>
            </div>
            ${isPending ? `
              <div style="display:flex; gap:8px;">
                <button class="btn btn-secondary btn-sm" data-reject="${r.id}" style="flex:1; color:#FF4757; border-color:#FF4757;">
                  ✗ Reject
                </button>
                <button class="btn btn-primary btn-sm" data-approve="${r.id}" style="flex:1;">
                  ✓ Approve
                </button>
              </div>
            ` : `
              <div style="font-size:11px; color:#7A8BA8;">
                ${isApproved ? '✅ Approved' : '❌ Rejected'}
              </div>
            `}
          </div>
        `;
      }).join('');

      container.querySelectorAll('[data-approve]').forEach(btn => {
        btn.addEventListener('click', () => approveRequest(btn.dataset.approve));
      });
      container.querySelectorAll('[data-reject]').forEach(btn => {
        btn.addEventListener('click', () => rejectRequest(btn.dataset.reject));
      });
    }

    async function approveRequest(id) {
      if (!confirm('Is owner ko approve karna hai?')) return;
      try {
        await updateDoc(doc(db, 'owner_requests', id), {
          status: 'approved',
          reviewedAt: serverTimestamp()
        });
        await updateDoc(doc(db, 'users', id), { approved: true });
        alert('✅ Owner approved!');
        loadRequests();
      } catch (e) {
        alert('Error: ' + e.message);
      }
    }

    async function rejectRequest(id) {
      const reason = prompt('Reject reason (optional):') || '';
      try {
        await updateDoc(doc(db, 'owner_requests', id), {
          status: 'rejected',
          reason,
          reviewedAt: serverTimestamp()
        });
        alert('❌ Owner rejected');
        loadRequests();
      } catch (e) {
        alert('Error: ' + e.message);
      }
    }

    function escape(s) {
      if (!s) return '';
      const d = document.createElement('div');
      d.textContent = s;
      return d.innerHTML;
    }

    document.querySelectorAll('#statusTabs .tab-segment').forEach(tab => {
      tab.addEventListener('click', () => {
        document.querySelectorAll('#statusTabs .tab-segment').forEach(t => t.classList.remove('active'));
        tab.classList.add('active');
        currentStatus = tab.dataset.status;
        render();
      });
    });

    loadRequests();
  </script>
</body>
</html>
