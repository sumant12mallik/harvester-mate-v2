<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0A0F1C">
  <title>Approval Pending - HarvesterMate</title>
  <link rel="icon" href="/assets/icons/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

<body class="auth-body">

  <div class="auth-container" style="text-align:center;">

    <div style="margin-bottom:32px;">
      <div style="width:100px; height:100px; border:2px solid #00FF88; border-radius:24px;
                  display:flex; align-items:center; justify-content:center;
                  margin:0 auto; font-size:48px; color:#00FF88;
                  box-shadow:0 0 40px rgba(0,255,136,0.3);">
        📋
      </div>
    </div>

    <h1 style="font-size:24px; font-weight:800; color:#FFFFFF; margin-bottom:12px;">
      Admin Approval Required
    </h1>

    <p style="font-size:14px; color:#B0BEC5; line-height:1.7; margin-bottom:12px;">
      Aapka Harvester Owner registration submit ho gaya hai.
      Admin review karega — approve hone ke baad aap login kar payenge.
    </p>

    <p style="font-size:12px; color:#7A8BA8; margin-bottom:32px;">
      Usually 24-48 hours lagte hai review me.
    </p>

    <button class="btn btn-full" style="background:rgba(255,167,38,0.15); color:#FFA726;
            border:1px solid #FFA726; cursor:not-allowed;" disabled>
      ⏳ Pending Approval
    </button>

    <div style="margin-top:32px; padding-top:24px; border-top:1px solid rgba(255,255,255,0.06);">
      <p style="font-size:13px; color:#7A8BA8; margin-bottom:12px;">
        Koi problem? Sampark karo:
      </p>
      <a href="mailto:support@harvestermate.app"
         style="color:#00FF88; font-size:14px; font-weight:600;">
        📧 support@harvestermate.app
      </a>
    </div>

    <div style="margin-top:24px;">
      <a href="/pages/auth/login.html"
         style="color:#00FF88; font-size:14px; font-weight:600;">
        ← Back to Login
      </a>
    </div>

  </div>
