<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0A0F1C">
  <title>Forgot Password - HarvesterMate</title>
  <link rel="icon" href="/assets/icons/favicon.ico">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/main.css">
</head>
<body class="auth-body">

  <div class="auth-container">

    <div class="auth-header">
      <div class="auth-logo">
        <div style="font-size:60px;">🔑</div>
      </div>
      <h1 class="auth-title">Forgot Password?</h1>
      <p class="auth-subtitle">Reset link apni registered mobile number pe bhejenge</p>
    </div>

    <div id="forgotError" class="auth-error"></div>
    <div id="forgotSuccess" class="auth-info" style="display:none;"></div>

    <form id="forgotForm" class="auth-form">

      <div class="input-group">
        <div class="input-wrapper">
          <span class="input-icon">📱</span>
          <input type="tel" id="mobile" name="mobile" class="input-field has-icon"
                 placeholder="Registered Mobile Number" maxlength="10"
                 inputmode="numeric" required>
        </div>
      </div>

      <button type="submit" id="resetBtn" class="btn btn-primary btn-full auth-submit">
        Send Reset Link
      </button>

    </form>

    <div class="auth-footer">
      Remember password?
      <a href="/pages/auth/login.html">Back to Login</a>
    </div>

  </div>

  <script type="module">
    import { auth } from '/js/config/firebase-config.js';
    import { sendPasswordResetEmail } from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

    const form = document.getElementById('forgotForm');
    const errorEl = document.getElementById('forgotError');
    const successEl = document.getElementById('forgotSuccess');
    const btn = document.getElementById('resetBtn');

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errorEl.classList.remove('active');
      successEl.style.display = 'none';

      const mobile = document.getElementById('mobile').value.trim();
      if (mobile.length !== 10) {
        errorEl.textContent = 'Sahi 10 digit mobile number daalo';
        errorEl.classList.add('active');
        return;
      }

      btn.disabled = true;
      btn.textContent = 'Sending...';

      try {
        const email = `${mobile}@harvestermate.app`;
        await sendPasswordResetEmail(auth, email);
        successEl.textContent = '✅ Reset link bhej diya gaya. Apna email check karo.';
        successEl.style.display = 'block';
      } catch (err) {
        errorEl.textContent = err.message || 'Kuch galat ho gaya';
        errorEl.classList.add('active');
      } finally {
        btn.disabled = false;
        btn.textContent = 'Send Reset Link';
      }
    });
  </script>
</body>
</html>
