<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0A0F1C">
  <title>Offline - HarvesterMate</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Poppins', sans-serif;
      background: #0A0F1C;
      color: #fff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }
    .container { max-width: 400px; }
    .icon {
      font-size: 80px;
      margin-bottom: 24px;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.8; }
      50% { transform: scale(1.1); opacity: 1; }
    }
    h1 {
      font-size: 28px;
      font-weight: 800;
      margin-bottom: 12px;
      color: #fff;
    }
    p {
      color: #7A8BA8;
      margin-bottom: 32px;
      line-height: 1.6;
      font-size: 14px;
    }
    button {
      background: linear-gradient(135deg, #00FF88, #00CC6A);
      color: #0A0F1C;
      border: none;
      padding: 14px 40px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      font-family: inherit;
      box-shadow: 0 4px 20px rgba(0, 255, 136, 0.4);
      transition: all 0.2s;
    }
    button:active {
      transform: scale(0.96);
      box-shadow: 0 2px 10px rgba(0, 255, 136, 0.6);
    }
    .badge {
      display: inline-block;
      padding: 4px 12px;
      background: rgba(0, 255, 136, 0.1);
      color: #00FF88;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 600;
      margin-bottom: 20px;
      letter-spacing: 0.05em;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">OFFLINE MODE</div>
    <div class="icon">📡</div>
    <h1>You're Offline</h1>
    <p>
      Internet connection check karo aur dobara try karo.
      Aapka data safe hai aur online hone par automatically sync ho jayega.
    </p>
    <button onclick="location.reload()">🔄 Retry</button>
  </div>
</body>
</html>
