<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="greenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#00FF88;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00CC6A;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <circle cx="100" cy="100" r="90" fill="#0A0F1C" stroke="url(#greenGrad)" stroke-width="3"/>

  <rect x="70" y="100" width="50" height="30" rx="4" fill="url(#greenGrad)" filter="url(#glow)"/>
  <rect x="90" y="80" width="30" height="25" rx="3" fill="url(#greenGrad)"/>
  <rect x="95" y="85" width="20" height="15" rx="2" fill="#0A0F1C"/>

  <circle cx="82" cy="140" r="18" fill="#0A0F1C" stroke="url(#greenGrad)" stroke-width="4"/>
  <circle cx="82" cy="140" r="6" fill="url(#greenGrad)"/>

  <circle cx="120" cy="145" r="12" fill="#0A0F1C" stroke="url(#greenGrad)" stroke-width="3"/>
  <circle cx="120" cy="145" r="4" fill="url(#greenGrad)"/>

  <path d="M 60 70 Q 70 50, 85 70 Q 95 55, 105 70 Q 115 55, 130 70 Q 140 50, 150 70"
        stroke="url(#greenGrad)" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#glow)"/>

  <circle cx="70" cy="60" r="3" fill="#00FF88"/>
  <circle cx="95" cy="58" r="3" fill="#00FF88"/>
  <circle cx="120" cy="58" r="3" fill="#00FF88"/>
  <circle cx="140" cy="60" r="3" fill="#00FF88"/>
</svg>